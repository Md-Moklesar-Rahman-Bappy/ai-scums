# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 3

updates:
  # Composer (Laravel/PHP Dependencies)
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Dhaka"

    open-pull-requests-limit: 10

    commit-message:
      prefix: "composer"
      include: "scope"

    labels:
      - "dependencies"
      - "security"
      - "php"

  # NPM Dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Dhaka"

    open-pull-requests-limit: 10

    commit-message:
      prefix: "npm"
      include: "scope"

    labels:
      - "dependencies"
      - "security"
      - "frontend"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Dhaka"

    commit-message:
      prefix: "github-actions"
      include: "scope"

    labels:
      - "github-actions"
      - "security"
